/* User-triggered refresh: never starts a background timer or scheduled job. */
(function(){
  const source='https://izmyrun.pages.dev/s/taya/parkrun/';
  const btn=document.querySelector('.bot-refresh');
  if(!btn)return;
  
  btn.setAttribute('role','button');btn.setAttribute('tabindex','0');
  let status=document.getElementById('refresh-status');
  if(!status){status=document.createElement('span');status.id='refresh-status';status.setAttribute('role','status');status.style.cssText='display:inline-block;margin-left:12px;font-size:13px';btn.after(status);}
  function setStatus(message){status.textContent=message;}
  function valid(doc){
    const title=(doc.querySelector('title')?.textContent||'');
    return title.includes('Тая') && doc.querySelectorAll('table tbody tr').length>0;
  }
  async function fetchHtml(){
    const urls=[source,'https://api.allorigins.win/raw?url='+encodeURIComponent(source)];
    let last;
    for(const url of urls){
      try{
        const res=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(18000)});
        if(!res.ok)throw Error('HTTP '+res.status);
        const html=await res.text();
        const doc=new DOMParser().parseFromString(html,'text/html');
        if(!valid(doc))throw Error('Не получены результаты Таи');
        return doc;
      }catch(err){last=err;}
    }
    throw last||new Error('Источник недоступен');
  }
  function parseRow(tr){
    const cells=[...tr.querySelectorAll('td')];
    return cells.map(c=>c.textContent.trim()).join('|');
  }
  async function refresh(ev){
    ev.preventDefault();
    if(btn.dataset.busy==='1')return;
    btn.dataset.busy='1';btn.style.opacity='.6';
    setStatus('Проверяю результаты…');
    try{
      const doc=await fetchHtml();
      const existing=[...document.querySelectorAll('table tbody tr')].map(parseRow).join('\n');
      const incoming=[...doc.querySelectorAll('table tbody tr')].map(parseRow).join('\n');
      if(existing===incoming){setStatus('Новых результатов нет');return;}
      // Import updated source markup, including new years, photo galleries, map data and stats.
      const incomingMain=doc.querySelector('main');
      if(!incomingMain)throw Error('На источнике отсутствует содержимое');
      const clone=document.importNode(incomingMain,true);
      const base=new URL(source);
      for(const el of clone.querySelectorAll('[src],[href]')){
        for(const attr of ['src','href']){
          const value=el.getAttribute(attr);
          if(value && !value.startsWith(('#','data:','blob:','mailto:','javascript:'))){
            el.setAttribute(attr,new URL(value,base).href);
          }
        }
      }
      document.querySelector('main').replaceWith(clone);
      const data=doc.getElementById('map-data');
      const old=document.getElementById('map-data');
      if(data&&old)old.textContent=data.textContent;
      const newBtn=document.querySelector('.bot-refresh');
      if(newBtn){newBtn.removeAttribute('href');newBtn.removeAttribute('target');newBtn.addEventListener('click',refresh);}
      const newStatus=document.createElement('span');newStatus.id='refresh-status';newStatus.setAttribute('role','status');newStatus.textContent='Результаты обновлены';newStatus.style.cssText='margin-left:12px;font-size:13px';
      newBtn?.after(newStatus);
      // Reload JavaScript of source so year navigation, filters and map are initialized.
      for(const item of doc.querySelectorAll('script[src]')){
        const s=document.createElement('script');
        s.src=new URL(item.getAttribute('src'),base).href;s.defer=true;
        document.body.appendChild(s);
      }
    }catch(err){setStatus('Не удалось получить данные: '+err.message);}
    finally{btn.dataset.busy='0';btn.style.opacity='';}
  }
  btn.addEventListener('click',refresh);
  btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();refresh(e);}});
})();
</script></body></html>
