name: Update Taya results from run5k
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-taya-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch run5k results and rebuild table
        run: python scripts/refresh_run5k.py
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Taya results from run5k"
            git push
          fi
